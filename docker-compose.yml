# Local development stack: PostgreSQL, LocoHiringService and LocoHiringWeb.
#   docker compose up --build
# Host ports default to the ones in the README; override them when they are taken, e.g.
#   SERVICE_PORT=18080 WEB_PORT=18081 docker compose up --build
name: locohiring

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: locohiring
      POSTGRES_USER: locohiring
      POSTGRES_PASSWORD: locohiring
      TZ: Australia/Sydney
      PGTZ: Australia/Sydney
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locohiring -d locohiring"]
      interval: 5s
      timeout: 5s
      retries: 20

  service:
    build:
      context: .
      dockerfile: LocoHiringService/service/Dockerfile
      # Builds download Maven dependencies; host networking avoids relying on the default bridge network.
      network: host
    environment:
      TZ: Australia/Sydney
      DB_URL: jdbc:postgresql://postgres:5432/locohiring
      DB_USERNAME: locohiring
      DB_PASSWORD: locohiring
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5080
    ports:
      - "${SERVICE_PORT:-18080}:8080"
      - "${SERVICE_DEBUG_PORT:-5080}:5080"
    volumes:
      - service-logs:/tmp
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: LocoHiringWeb/Dockerfile
      # Builds download Maven dependencies; host networking avoids relying on the default bridge network.
      network: host
    environment:
      TZ: Australia/Sydney
      LOCOHIRING_SERVICE_URL: http://service:8080
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5081
    ports:
      - "${WEB_PORT:-18081}:8081"
      - "${WEB_DEBUG_PORT:-5081}:5081"
    depends_on:
      - service

volumes:
  postgres-data:
  service-logs:
