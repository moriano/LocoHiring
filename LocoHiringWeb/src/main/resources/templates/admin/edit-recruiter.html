<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Edit recruiter')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<main class="container pb-5" th:with="r=${recruiter}">
    <div th:replace="~{layout :: flash}"></div>
    <a class="small" th:href="@{/admin/users}">&larr; Users</a>
    <h1 class="h3 mt-1 mb-4">
        <span th:text="${r.firstName} + ' ' + ${r.surname ?: ''}">Alice</span>
        <span class="badge text-bg-secondary" th:unless="${r.active}">deactivated</span>
    </h1>
    <div class="card" style="max-width: 640px">
        <div class="card-header">Recruiter</div>
        <form class="card-body" method="post" th:action="@{/admin/users/recruiters/{id}(id=${r.id})}">
            <div class="row g-2 mb-3">
                <div class="col">
                    <label class="form-label" for="firstName">First name</label>
                    <input class="form-control" id="firstName" name="firstName" required th:value="${r.firstName}">
                </div>
                <div class="col">
                    <label class="form-label" for="surname">Surname</label>
                    <input class="form-control" id="surname" name="surname" th:value="${r.surname}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email (login)</label>
                <input class="form-control" id="email" name="email" type="email" required th:value="${r.email}">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">New password</label>
                <input class="form-control" id="password" name="password" type="password" minlength="8"
                       autocomplete="new-password" placeholder="Leave empty to keep the current one">
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="admin" name="admin" value="true" th:checked="${r.admin}">
                <label class="form-check-label" for="admin">Admin (can do anything)</label>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="active" name="active" value="true" th:checked="${r.active}">
                <label class="form-check-label" for="active">Active</label>
                <div class="form-text">Deactivated recruiters cannot log in. Their candidates and funnels stay as they are.</div>
            </div>
            <button class="btn btn-dark" type="submit">Save</button>
        </form>
    </div>
</main>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
