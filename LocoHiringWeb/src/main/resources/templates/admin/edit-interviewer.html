<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Edit interviewer')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<main class="container pb-5" th:with="i=${interviewer}">
    <div th:replace="~{layout :: flash}"></div>
    <a class="small" th:href="@{/admin/users}">&larr; Users</a>
    <h1 class="h3 mt-1 mb-4">
        <span th:text="${i.firstName} + ' ' + ${i.surname ?: ''}">Peter</span>
        <span class="badge text-bg-secondary" th:unless="${i.active}">deactivated</span>
    </h1>
    <div class="card" style="max-width: 640px">
        <div class="card-header">Interviewer</div>
        <form class="card-body" method="post" th:action="@{/admin/users/interviewers/{id}(id=${i.id})}">
            <div class="row g-2 mb-3">
                <div class="col">
                    <label class="form-label" for="firstName">First name</label>
                    <input class="form-control" id="firstName" name="firstName" required th:value="${i.firstName}">
                </div>
                <div class="col">
                    <label class="form-label" for="surname">Surname</label>
                    <input class="form-control" id="surname" name="surname" th:value="${i.surname}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email (login)</label>
                <input class="form-control" id="email" name="email" type="email" required th:value="${i.email}">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">New password</label>
                <input class="form-control" id="password" name="password" type="password" minlength="8"
                       autocomplete="new-password" placeholder="Leave empty to keep the current one">
            </div>
            <div class="row g-2 mb-3 align-items-end">
                <div class="col-3">
                    <label class="form-label" for="level">Level</label>
                    <input class="form-control" id="level" name="level" type="number" min="1" required th:value="${i.level}">
                </div>
                <div class="col">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="barRaiser" name="barRaiser" value="true" th:checked="${i.barRaiser}">
                        <label class="form-check-label" for="barRaiser">Bar raiser</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="admin" name="admin" value="true" th:checked="${i.admin}">
                        <label class="form-check-label" for="admin">Admin</label>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <div class="form-label">Interviews for</div>
                <div class="form-check form-check-inline" th:each="f : ${jobFamilies}">
                    <input class="form-check-input" type="checkbox" name="jobFamilyIds" th:value="${f.id}" th:id="'jf' + ${f.id}"
                           th:checked="${selectedFamilies.contains(f.id)}">
                    <label class="form-check-label" th:for="'jf' + ${f.id}" th:text="${f.name}">family</label>
                </div>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="active" name="active" value="true" th:checked="${i.active}">
                <label class="form-check-label" for="active">Active</label>
                <div class="form-text">Deactivated interviewers cannot log in or be booked. Interviews they already have
                    keep them until a recruiter reassigns them.</div>
            </div>
            <button class="btn btn-dark" type="submit">Save</button>
        </form>
    </div>
</main>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
