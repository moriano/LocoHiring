<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${candidate.firstName})}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<main class="container pb-5">
    <div th:replace="~{layout :: flash}"></div>
    <h1 class="h3 mb-1" th:text="${candidate.firstName} + ' ' + ${candidate.surname ?: ''}">Adam</h1>
    <p class="text-muted mb-4">
        <span th:text="${candidate.email}">email</span> ·
        <span th:text="${candidate.positionName}">position</span>
        (<span th:text="${candidate.jobFamilyName}">family</span>, level <span th:text="${candidate.positionLevel}">5</span>)
    </p>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">Applications</div>
                <table class="table table-hover mb-0">
                    <thead class="table-light"><tr><th>Funnel</th><th>Recruiter</th><th>Status</th><th>Started</th></tr></thead>
                    <tbody>
                    <tr th:if="${applications.isEmpty()}"><td colspan="4" class="text-muted">Not in any funnel yet.</td></tr>
                    <tr th:each="a : ${applications}">
                        <td><a th:href="@{/applications/{id}(id=${a.id})}" th:text="${a.funnelName}">Funnel</a></td>
                        <td th:text="${a.recruiterName}">Alice</td>
                        <td><span th:replace="~{layout :: applicationStatus(${a.status})}"></span></td>
                        <td th:text="${@fmt.dateTime(a.createdAt)}">date</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card mb-4" th:if="${funnels != null}">
                <div class="card-header">Put through a funnel</div>
                <form class="card-body" method="post" th:action="@{/candidates/{id}/applications(id=${candidate.id})}">
                    <p class="text-muted small" th:if="${funnels.isEmpty()}">There are no funnels yet.
                        <a th:href="@{/funnels}">Create one</a> first.</p>
                    <th:block th:unless="${funnels.isEmpty()}">
                        <select class="form-select mb-3" name="funnelId">
                            <option th:each="f : ${funnels}" th:value="${f.id}" th:text="${f.name}">Funnel</option>
                        </select>
                        <button class="btn btn-dark w-100" type="submit">Start application</button>
                        <p class="small text-muted mt-2 mb-0">You become the recruiter who owns it.</p>
                    </th:block>
                </form>
            </div>
            <div class="card">
                <div class="card-header">Resume</div>
                <div class="card-body">
                    <p th:if="${candidate.hasResume}">
                        <a class="btn btn-outline-dark btn-sm" th:href="@{/candidates/{id}/resume(id=${candidate.id})}">Download resume</a>
                    </p>
                    <p class="text-muted small" th:unless="${candidate.hasResume}">No resume uploaded.</p>
                    <form th:if="${me.seesRecruiterPages()}" method="post" enctype="multipart/form-data"
                          th:action="@{/candidates/{id}/resume(id=${candidate.id})}">
                        <input class="form-control form-control-sm mb-2" type="file" name="file" required>
                        <button class="btn btn-dark btn-sm" type="submit" th:text="${candidate.hasResume} ? 'Replace resume' : 'Upload resume'">Upload</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
