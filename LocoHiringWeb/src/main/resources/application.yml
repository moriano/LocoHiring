server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        # Browsers do not send the session cookie on cross-site form posts.
        same-site: lax

spring:
  application:
    name: locohiring-web
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

locohiring:
  service-url: ${LOCOHIRING_SERVICE_URL:http://localhost:8080}
